<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | TCF Institute</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#0b0f1a;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
canvas{position:fixed;inset:0;z-index:0;}
.content{position:relative;z-index:1;padding:40px 20px;}
.error-code{font-size:120px;font-weight:900;background:linear-gradient(135deg,#00ffff,#0080ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:10px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-15px);}}
h2{font-size:28px;font-weight:700;margin-bottom:12px;}
p{color:#aaa;font-size:16px;margin-bottom:30px;max-width:400px;margin-left:auto;margin-right:auto;}
.btn-group{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn{padding:12px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;transition:0.3s;}
.btn-primary{background:linear-gradient(135deg,#00ffff,#0080ff);color:#000;}
.btn-primary:hover{opacity:0.85;transform:translateY(-3px);}
.btn-outline{background:transparent;color:#00ffff;border:2px solid rgba(0,255,255,0.3);}
.btn-outline:hover{border-color:#00ffff;transform:translateY(-3px);}
.links{margin-top:40px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.links a{color:#555;text-decoration:none;font-size:13px;transition:0.3s;}
.links a:hover{color:#00ffff;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <div class="error-code">404</div>
  <h2>Oops! Page Not Found</h2>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <div class="btn-group">
    <a href="index.html" class="btn btn-primary">🏠 Go Home</a>
    <a href="courses.html" class="btn btn-outline">📚 View Courses</a>
  </div>
  <div class="links">
    <a href="auth.html">Login</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="contact.html">Contact</a>
    <a href="placements.html">Placements</a>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,pts=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
for(let i=0;i<60;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*2+1});
function draw(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(0,255,255,0.4)';ctx.fill();});
  pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<100){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(0,255,255,${0.1*(1-d/100)})`;ctx.lineWidth=0.5;ctx.stroke();}}));
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
