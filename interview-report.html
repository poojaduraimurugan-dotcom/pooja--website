<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Report - TCF Institute</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #ff6400; --bg: #0b0f1a; --card: #111827; --text: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px 20px; }
        .report-container { max-width: 800px; margin: auto; background: var(--card); border-radius: 20px; padding: 40px; border: 1px solid rgba(255,100,0,0.1); }
        
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid #374151; padding-bottom: 20px; }
        .header h1 { color: var(--primary); font-size: 32px; }
        .header p { color: #94a3b8; margin-top: 10px; }

        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .score-circle span { font-size: 36px; font-weight: 800; }

        .status-pill { display: inline-block; padding: 8px 24px; border-radius: 30px; font-weight: 700; margin-bottom: 30px; }
        .status-pill.passed { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-pill.failed { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .section { margin-bottom: 30px; text-align: left; }
        .section h3 { color: var(--primary); margin-bottom: 12px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .section p { line-height: 1.7; color: #cbd5e1; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; }

        .actions { display: flex; gap: 15px; justify-content: center; margin-top: 40px; }
        .btn { padding: 12px 30px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; border: none; text-decoration: none; }
        .btn-pdf { background: #374151; color: white; }
        .btn-pdf:hover { background: #4b5563; }
        .btn-retry { background: var(--primary); color: white; }
        .btn-retry:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,100,0,0.3); }
    </style>
</head>
<body>

<div class="report-container" id="reportContent">
    <div class="header">
        <h1>Performance Analysis</h1>
        <p id="reportDate"></p>
    </div>

    <div style="text-align: center;">
        <div class="score-circle">
            <span id="scoreVal">0</span>
        </div>
        <div id="statusPill" class="status-pill">EVALUATING</div>
    </div>

    <div class="section">
        <h3>Summary</h3>
        <p id="summary">Preparing your summary...</p>
    </div>

    <div class="section">
        <h3>Key Strengths</h3>
        <p id="strengths">Identifying your strong points...</p>
    </div>

    <div class="section" style="display: flex; gap: 20px;">
        <div style="flex: 1;"><h3>Confidence</h3><p id="confLevel">-</p></div>
        <div style="flex: 1;"><h3>Communication</h3><p id="commRating">-</p></div>
    </div>

    <div class="section">
        <h3>Areas for Improvement</h3>
        <p id="weaknesses">Analyzing gaps...</p>
    </div>

    <div class="section">
        <h3>Recommendations</h3>
        <p id="suggestions">Generating roadmap...</p>
    </div>
</div>

<div class="actions">
    <button class="btn btn-pdf" onclick="downloadPDF()">📥 Download PDF</button>
    <a href="interview.html" class="btn btn-retry">🔄 Try Again</a>
    <a href="dashboard.html" class="btn btn-pdf">🏠 Dashboard</a>
</div>

<script>
    document.getElementById('reportDate').innerText = new Date().toDateString();

    function loadReport() {
        const data = JSON.parse(localStorage.getItem('lastReport'));
        if (!data) {
            alert("No report found. Please complete an interview first.");
            window.location.href = 'interview.html';
            return;
        }

        document.getElementById('scoreVal').innerText = data.score + "/10";
        document.getElementById('summary').innerText = data.summary;
        document.getElementById('strengths').innerText = data.strengths;
        document.getElementById('weaknesses').innerText = data.weaknesses;
        document.getElementById('suggestions').innerText = data.suggestions;
        document.getElementById('confLevel').innerText = data.confidence_level || 'N/A';
        document.getElementById('commRating').innerText = data.communication_rating || 'N/A';

        const pill = document.getElementById('statusPill');
        if (data.passed) {
            pill.innerText = "✓ INTERVIEW PASSED";
            pill.className = "status-pill passed";
        } else {
            pill.innerText = "⚠ NEEDS IMPROVEMENT";
            pill.className = "status-pill failed";
        }
    }

    function downloadPDF() {
        const element = document.getElementById('reportContent');
        const opt = {
            margin:       10,
            filename:     'TCF-Interview-Report.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, backgroundColor: '#111827' },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    window.onload = loadReport;
</script>

</body>
</html>
